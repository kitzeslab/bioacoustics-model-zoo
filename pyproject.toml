[project]
name = "bioacoustics-model-zoo"
version = "0.13.4"
description = "Public repository of machine learning models for bioacoustics, with OpenSoundscape integration"
authors = [{ name = "sammlapp", email = "sammlapp@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
keywords = ["bioacoustics", "machine-learning", "audio", "ecology", "birds", "sound-classification", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "opensoundscape~=0.13.2",
    "PyGithub>=2.6.1",
    "huggingface-hub>=0.33.4",
]

[project.urls]
Homepage = "https://github.com/kitzeslab/bioacoustics-model-zoo"
Repository = "https://github.com/kitzeslab/bioacoustics-model-zoo"
Documentation = "https://github.com/kitzeslab/bioacoustics-model-zoo/blob/main/README.md"

[project.optional-dependencies]
tensorflow = ["tensorflow>=2.20.0", "tf-keras>=2.20.0", "kagglehub>=1.0.0"]
perch = ["tensorflow>=2.20.0", "tf-keras>=2.20.0", "kagglehub>=1.0.0"]
perch2 = ["tensorflow>=2.20.0", "tf-keras>=2.20.0", "kagglehub>=1.0.0"]
birdnet = ["ai-edge-litert>=2.1.2"]
hawkears = ["torch>=1.13.0", "torchvision>=0.14.0", "torchaudio>=0.13.0", "timm>=0.9.0", "opencv-python>=4.13.0"]
birdset = ["torch>=1.13.0", "torchvision>=0.14.0", "torchaudio>=0.13.0", "transformers>=4.20.0"]
pytorch = ["torch>=1.13.0", "torchvision>=0.14.0", "torchaudio>=0.13.0"]
hawkears2 = ["hawkears>=2.2.0"]
all = [
    "tensorflow>=2.20.0",
    "tf-keras>=2.20.0",
    "kagglehub>=1.0.0",
    "ai-edge-litert>=2.1.2",
    "torch>=1.13.0",
    "torchvision>=0.14.0",
    "torchaudio>=0.13.0",
    "timm>=0.9.0",
    "opencv-python>=4.13.0",
    "transformers>=4.20.0",
    "hawkears>=2.2.0",
]

[dependency-groups]
dev = [
    "black>=24.8.0,<25.0.0",
    "ipykernel>=7.3.0",
    "pytest>=8.3.2,<9.0.0",
    "requests-mock>=1.11.0,<2.0.0",
    "tensorflow>=2.21.0",
    "tensorflow-hub>=0.16.1",
    "tensorflow-metal>=1.2.0",
]

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bioacoustics_model_zoo"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
